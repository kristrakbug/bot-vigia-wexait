name: Bot Vigia Mayflux (Cada 30 min)

on:
  schedule:
    # De 8:05 AM a 6:35 PM (Hora Colombia)
    - cron: '5,35 13-23 * * *'
    # De 7:05 PM a 10:35 PM (Hora Colombia)
    - cron: '5,35 0-3 * * *'
  workflow_dispatch:

jobs:
  escanear-mayflux:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Instalar dependencias y Chrome para Puppeteer
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: 4. Ejecutar Bot Vigia
        env:
          TOKEN_SECRETO: ${{ secrets.TOKEN_SECRETO }}
          CORREO_PROVEEDOR: ${{ secrets.CORREO_PROVEEDOR }}
          CONTRASENA_PROVEEDOR: ${{ secrets.CONTRASENA_PROVEEDOR }}
        run: node index.js
